autocompute: True
mapnumpy: True
# SuiteSparse:GraphBLAS C JIT control, set when graphblas initializes the "suitesparse"
# backend: "on", "load", "run", "pause" or "off". Environment variable: GRAPHBLAS_JIT_C_CONTROL.
# Unset (null) is "run", which python-graphblas raises to "on" when C source needs compiling
# (as for a built-in operator on a user-defined type); a value set here is not raised.
# See "The SuiteSparse:GraphBLAS JIT" in the user guide's initialization page, and
# "The JIT control" in the Technical Notes for the exact rules.
jit_c_control: null
# Tensor: largest number of entries an implicit broadcast may replicate (ewise_add / union)
tensor_max_expansion: 1000000000
# graphblas.array_api: largest number of elements an operation may make dense (np.asarray,
# cumulative_sum, dense linalg)
array_api_densify_limit: 100000000
