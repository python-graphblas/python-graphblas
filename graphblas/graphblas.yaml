autocompute: True
mapnumpy: True
# SuiteSparse:GraphBLAS C JIT control, set when graphblas initializes the "suitesparse"
# backend: "on", "load", "run", "pause" or "off". Environment variable: GRAPHBLAS_JIT_C_CONTROL.
# Unset (null) is "run", raised to "on" when UDT work needs a kernel compiled; a value set
# through this key is kept.
# See "The SuiteSparse:GraphBLAS JIT" in the user guide's initialization page.
jit_c_control: null
# Tensor: largest number of entries an implicit broadcast may replicate (ewise_add / union)
tensor_max_expansion: 1000000000
# graphblas.array_api: most elements an array may hold densely (np.asarray, cumulative_sum, ...)
array_api_densify_limit: 100000000
# graphblas.array_api: keep the sign of every zero a product or quotient makes with an unstored
# zero, as numpy (True), even where that stores every position (a row scaling d[:, None] * A with
# negative d); by default (False) those positions read 0.0, and multiply stores the intersection
array_api_signed_zeros: false
